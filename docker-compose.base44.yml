services:
  web:
    image: node:22-slim
    working_dir: /workspace
    volumes:
      - ${BASE44_PROJECT_ROOT:-.}:/workspace
    env_file:
      - ./.env
    environment:
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN:-}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
    ports:
      - "3000:3000"
    command: ["sh", "-ec", "npm i -g bun >/dev/null 2>&1; bun install --frozen-lockfile; exec bun run dev -- --host 0.0.0.0 --port 3000 --strictPort"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
