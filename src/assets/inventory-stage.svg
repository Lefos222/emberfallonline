<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" preserveAspectRatio="xMidYMid slice" role="presentation">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b38"/>
      <stop offset="42%" stop-color="#120827"/>
      <stop offset="100%" stop-color="#06030d"/>
    </linearGradient>
    <radialGradient id="nebA" cx="26%" cy="24%" r="62%">
      <stop offset="0" stop-color="#8a44ff" stop-opacity="0.5"/>
      <stop offset="52%" stop-color="#40208c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b0518" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="78%" cy="72%" r="58%">
      <stop offset="0" stop-color="#2f7bd6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0b0518" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="52%" cy="58%" r="34%">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="64%">
      <stop offset="52%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <rect width="480" height="640" fill="url(#sky)"/>
  <rect width="480" height="640" fill="url(#nebA)"/>
  <rect width="480" height="640" fill="url(#nebB)"/>
  <rect width="480" height="640" fill="url(#ember)"/>

  <!-- Deep field stars -->
  <g fill="#ffffff">
    <circle cx="34" cy="58" r="1.1" opacity=".75"/>
    <circle cx="92" cy="112" r="0.8" opacity=".55"/>
    <circle cx="148" cy="42" r="1.3" opacity=".8"/>
    <circle cx="206" cy="88" r="0.7" opacity=".5"/>
    <circle cx="262" cy="36" r="1" opacity=".7"/>
    <circle cx="318" cy="96" r="1.4" opacity=".85"/>
    <circle cx="386" cy="54" r="0.9" opacity=".6"/>
    <circle cx="440" cy="104" r="1.1" opacity=".7"/>
    <circle cx="58" cy="186" r="1.2" opacity=".65"/>
    <circle cx="122" cy="242" r="0.8" opacity=".5"/>
    <circle cx="188" cy="166" r="1" opacity=".6"/>
    <circle cx="246" cy="214" r="1.3" opacity=".75"/>
    <circle cx="304" cy="158" r="0.7" opacity=".45"/>
    <circle cx="368" cy="212" r="1.1" opacity=".65"/>
    <circle cx="424" cy="176" r="0.8" opacity=".5"/>
    <circle cx="40" cy="322" r="1" opacity=".55"/>
    <circle cx="104" cy="386" r="1.4" opacity=".7"/>
    <circle cx="166" cy="304" r="0.8" opacity=".5"/>
    <circle cx="228" cy="352" r="1.1" opacity=".6"/>
    <circle cx="292" cy="296" r="0.9" opacity=".5"/>
    <circle cx="354" cy="348" r="1.3" opacity=".7"/>
    <circle cx="416" cy="302" r="0.8" opacity=".45"/>
    <circle cx="66" cy="470" r="1.1" opacity=".6"/>
    <circle cx="132" cy="524" r="0.9" opacity=".5"/>
    <circle cx="196" cy="452" r="1.2" opacity=".6"/>
    <circle cx="258" cy="508" r="0.8" opacity=".45"/>
    <circle cx="322" cy="462" r="1" opacity=".55"/>
    <circle cx="388" cy="520" r="1.2" opacity=".6"/>
    <circle cx="444" cy="456" r="0.9" opacity=".5"/>
    <circle cx="84" cy="596" r="1" opacity=".45"/>
    <circle cx="214" cy="606" r="0.9" opacity=".4"/>
    <circle cx="348" cy="600" r="1.1" opacity=".45"/>
  </g>

  <!-- Bright stars with a soft halo -->
  <g fill="#e8f1ff" filter="url(#halo)">
    <circle cx="148" cy="42" r="2.2"/>
    <circle cx="318" cy="96" r="2"/>
    <circle cx="246" cy="214" r="2.1"/>
    <circle cx="104" cy="386" r="2"/>
    <circle cx="388" cy="520" r="1.9"/>
  </g>

  <!-- A constellation drawn in gold, the way the game's own sky is painted -->
  <g stroke="#ffd88a" stroke-opacity="0.42" stroke-width="1.1" fill="none">
    <path d="M64 140 L128 104 L196 128 L238 82 L296 108"/>
    <path d="M128 104 L146 48"/>
    <path d="M196 128 L182 190"/>
    <path d="M296 108 L344 152 L330 214"/>
  </g>
  <g fill="#ffe9c8">
    <circle cx="64" cy="140" r="2.6"/>
    <circle cx="128" cy="104" r="3"/>
    <circle cx="196" cy="128" r="2.4"/>
    <circle cx="238" cy="82" r="2.2"/>
    <circle cx="296" cy="108" r="2.8"/>
    <circle cx="146" cy="48" r="2"/>
    <circle cx="182" cy="190" r="2"/>
    <circle cx="344" cy="152" r="2.2"/>
    <circle cx="330" cy="214" r="2"/>
  </g>
  <g fill="#ffd88a" opacity=".5">
    <circle cx="128" cy="104" r="7" filter="url(#halo)"/>
    <circle cx="296" cy="108" r="6" filter="url(#halo)"/>
  </g>

  <rect width="480" height="640" fill="url(#vig)"/>
</svg>
