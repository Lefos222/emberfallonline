<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="presentation">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe4ee"/>
      <stop offset="0.38" stop-color="#8e9aa6"/>
      <stop offset="1" stop-color="#333a42"/>
    </linearGradient>
    <linearGradient id="steelSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8894"/>
      <stop offset="1" stop-color="#22272d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3d2"/>
      <stop offset="0.45" stop-color="#e6bc72"/>
      <stop offset="1" stop-color="#8a5a22"/>
    </linearGradient>
    <linearGradient id="haft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4a26"/>
      <stop offset="0.5" stop-color="#4a2a13"/>
      <stop offset="1" stop-color="#2a160a"/>
    </linearGradient>
    <radialGradient id="hot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#ff8a1e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="48" cy="44" r="30" fill="url(#hot)"/>

  <!-- Anvil: horn, face, waist and foot -->
  <path d="M15 30 3 38l12 5Z" fill="url(#steelSide)"/>
  <path d="M18 28h44c8 0 13 3.5 13 8s-5 8-13 8H56l-3.5 8h-9L40 44H18c-7 0-12-3.5-12-8s5-8 12-8Z" fill="url(#steel)"/>
  <path d="M18 28h44c8 0 13 3.5 13 8H5c0-4.5 5-8 13-8Z" fill="#eef4fb" opacity=".45"/>
  <path d="M40 44h16l3 12H53l-2.5 12h-5L43 56h-6Z" fill="url(#steelSide)"/>
  <path d="M30 68h36l4 8H26Z" fill="url(#steel)"/>
  <path d="M26 76h44v4H26Z" fill="#1c2126"/>

  <!-- Crossed hammer -->
  <g transform="rotate(38 48 40)">
    <rect x="43" y="18" width="6" height="30" rx="2" fill="url(#haft)"/>
    <rect x="33" y="10" width="26" height="11" rx="2.5" fill="url(#steel)"/>
    <rect x="33" y="10" width="26" height="4" rx="2" fill="#eef4fb" opacity=".5"/>
    <rect x="35.5" y="13" width="21" height="3" rx="1.5" fill="url(#gold)" opacity=".8"/>
  </g>

  <!-- Sparks -->
  <g fill="#ffd27a">
    <circle cx="70" cy="18" r="2.1"/>
    <circle cx="80" cy="28" r="1.4" opacity=".8"/>
    <circle cx="24" cy="20" r="1.2" opacity=".65"/>
    <circle cx="76" cy="44" r="1" opacity=".55"/>
  </g>
</svg>
